[sprint]
	# Default: 1.5
	# Range: 1.0 ~ 3.0
	multiplier = 1.5
	# Default: 100.0
	# Range: 10.0 ~ 500.0
	max = 100.0
	# Default: 0.5
	# Range: 0.01 ~ 10.0
	drain = 0.5
	# Default: 0.2
	# Range: 0.01 ~ 10.0
	regen = 0.2
	# Default: 40
	# Range: 0 ~ 200
	delay = 40
	showBar = false
	hideFood = false
	disableHunger = false
	tacticalSprintAnimation = true
	#Open wooden doors when tactical sprinting into them
	openDoors = true
