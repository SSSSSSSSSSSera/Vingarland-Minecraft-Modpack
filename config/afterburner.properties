# Afterburner settings: true = on, false = off. Also in game: Options > Video Settings > Afterburner.
# Read when the game or server starts, so restart after changing this file.
# On a server only the "server and client" ones do anything. In singleplayer all of them do.

# Rendering
# face culling (client)
faceCulling=true
# translucent face culling (client)
translucentCulling=true
# leaf culling (client)
leafCulling=true
# batched chunk drawing (client)
chunkBatching=true
# smaller chunk vertices (client)
compactVertices=true
# off-screen chunk building (client)
offscreenBuilds=true
# occlusion culling (client)
occlusionCulling=true
# entity culling (client)
entityCulling=true
# visible-only animations (client)
visibleAnimations=true
# faster biome blending (client)
fastBiomeBlend=true
# bigger smooth lighting cache (client)
smoothLightCache=true
# faster visibility updates (client)
fastVisibility=true
# faster particles (client)
fastParticles=true

# Memory
# memory trim (client)
memoryTrim=true

# World and server
# parallel worldgen (server and client)
parallelWorldgen=true
# faster lighting (server and client)
fastLight=true
# faster collisions (server and client)
fastCollisions=true
# faster entity searches (server and client)
fastEntitySearch=true
# faster chunk ticks (server and client)
fastChunkTicks=true
# faster mob AI (server and client)
fastMobAi=true
# cheaper mob ticks (server and client)
fastMobTicks=true
# faster hoppers (server and client)
fastHoppers=true
# faster mob spawning (server and client)
fastSpawning=true
# faster structure layout (server and client)
fastStructures=true
# faster ore placement (server and client)
fastOres=true
# faster biome search (server and client)
fastBiomeSearch=true
# parked scheduled ticks (server and client)
parkedTicks=true
# sleeping idle furnaces (server and client)
idleBlockEntities=true
# sleeping idle hoppers (server and client)
idleHoppers=true
# faster explosions (server and client)
fastExplosions=true
# faster redstone dust (server and client)
fastRedstone=true
# faster water and lava flow (server and client)
fastFluids=true
# hopper container cache (server and client)
hopperCache=true
# faster pathfinding (server and client)
fastPathfinding=true
# off-thread structure search (server and client)
asyncStructureSearch=true
# cheaper entity tracking (server and client)
fastTracking=true
# cheaper item merging (server and client)
fastItemMerge=true
# slower AI for mobs far from players (off by default: changes how they act) (server and client)
farMobAi=false
# cheaper packet compression (server and client)
fastCompression=true
# shared chunk packets (server and client)
sharedChunkPackets=true
# shared chunk packet compression (server and client)
sharedChunkCompression=true
# let go of unused structure pieces (off by default: pays off with structure mods) (server and client)
idleTemplates=false
# hoppers see full chests (server and client)
forgeHoppers=true
# shared block shapes (server and client)
sharedShapes=true
# leaner chunk sections (server and client)
leanSections=true
# leaner block states (server and client)
leanStates=true

# Other
# lower worker priority (client)
workerPriority=true
